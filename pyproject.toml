[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-mh"
version = "0.1.0"
description = "Neural MCMC proposals with exact and learned MH ratios"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.scripts]
train-adversarial-mh = "adversarial_mh.train:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["adversarial_mh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
